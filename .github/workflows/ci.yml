name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # TestFlight uploads are manual only — see the `beta` job.
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. The repository default is `write`, and neither
# workflow writes to GitHub — but `actions/checkout` persists the token into
# .git/config, so any code running later in the job (an npm postinstall, a
# bundler hook) can read it. A read-only token makes that worthless.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/PT-Helper
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git against the remote, so don't leave the
          # credential in .git/config for later steps to find.
          persist-credentials: false

      - name: Select Xcode
        run: |
          # Use latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone | head -5

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/PT-Helper

      # Deliberately no SPM cache. Two attempts both made things worse:
      #
      # 1. Caching COIL.xcodeproj/project.xcworkspace/xcshareddata/swiftpm is unsafe —
      #    that directory holds the git-tracked Package.resolved, so a `restore-keys`
      #    fallback writes a stale copy over the checked-out one and the build silently
      #    uses different pinned versions (this repo has a hard Firebase >= 12.12.1
      #    floor). It also caches nothing useful: `clean test` puts the real checkouts in
      #    DerivedData, not there.
      # 2. Relocating them with -clonedSourcePackagesDirPath so they *could* be cached
      #    breaks the build: the Crashlytics run-script phase resolves its `run` binary
      #    from the default DerivedData/SourcePackages path, so moving the checkouts makes
      #    that phase fail with "No such file or directory".
      #
      # Fixing (2) means editing the Crashlytics build phase, which is not worth it for a
      # cache whose benefit was never measured. Revisit only with numbers.
      # UnitPlan, not SmokePlan. SmokePlan is an 11-test allow-list; the suite has
      # ~1,140 methods, so the old gate let a change to red-flag detection,
      # contraindication checking, or the prompt-injection sanitizer merge green.
      # UnitPlan runs the whole COILTests target in a few seconds of test time —
      # the extra coverage is effectively free. UI and collision tests stay out of
      # the PR path; they run nightly (FullPlan) and pre-release (PreReleasePlan).
      - name: Run UnitPlan
        run: |
          xcodebuild test \
            -project COIL.xcodeproj \
            -scheme COIL \
            -testPlan UnitPlan \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios/PT-Helper/fastlane/test_output

  functions:
    name: Cloud Functions (build, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git against the remote, so don't leave the
          # credential in .git/config for later steps to find.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (catalog + tsc)
        run: npm run build

      # Note: jest.config.js excludes test/rules/ and test/integration/ — those need
      # the Firestore emulator and run in the `functions-emulator` job below.
      - name: Unit tests (jest)
        run: npm test

      # Advisory gate: fail the build on HIGH or CRITICAL runtime (production)
      # advisories. MODERATE advisories are allowed through as documented,
      # time-bounded accepted residuals (see functions/docs/dependency-advisories.md).
      # Review that list before raising or lowering this threshold.
      - name: Security audit gate (runtime deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  # The Firestore security rules suite and the account-deletion integration test are
  # excluded from `npm test` (they need the emulator), so until now nothing ran them —
  # not in CI, and not as a documented manual step. They cover authorization boundaries
  # and account-deletion completeness, which is data-leak severity, so they gate PRs.
  # No secrets required: the npm scripts target `--project demo-coil`, and the `demo-`
  # prefix is Firebase's convention for a credential-free emulator-only project.
  functions-emulator:
    name: Cloud Functions (rules + integration, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git against the remote, so don't leave the
          # credential in .git/config for later steps to find.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a JVM process; pin the JDK rather than relying on
      # whatever the runner image ships.
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Installed here rather than as a devDependency: it is a ~100MB CLI that no
      # source file imports, and adding it to package.json would make every other
      # job's `npm ci` pay for it. Pinned to the version the emulator scripts are
      # validated against locally.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.7.0

      - name: Firestore security rules tests
        run: npm run test:rules

      - name: Integration tests
        run: npm run test:integration

  # Runs only on the manual dispatch that can reach `beta`, and gates it. Without this,
  # a TestFlight build was gated on unit tests alone — UI and collision regressions
  # could ship to testers untested, because FullPlan/PreReleasePlan never ran in CI.
  prerelease-tests:
    name: Pre-release gate (unit + UI + coverage)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios/PT-Helper
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git against the remote, so don't leave the
          # credential in .git/config for later steps to find.
          persist-credentials: false

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      # Deliberately no SPM cache. Two attempts both made things worse:
      #
      # 1. Caching COIL.xcodeproj/project.xcworkspace/xcshareddata/swiftpm is unsafe —
      #    that directory holds the git-tracked Package.resolved, so a `restore-keys`
      #    fallback writes a stale copy over the checked-out one and the build silently
      #    uses different pinned versions (this repo has a hard Firebase >= 12.12.1
      #    floor). It also caches nothing useful: `clean test` puts the real checkouts in
      #    DerivedData, not there.
      # 2. Relocating them with -clonedSourcePackagesDirPath so they *could* be cached
      #    breaks the build: the Crashlytics run-script phase resolves its `run` binary
      #    from the default DerivedData/SourcePackages path, so moving the checkouts makes
      #    that phase fail with "No such file or directory".
      #
      # Fixing (2) means editing the Crashlytics build phase, which is not worth it for a
      # cache whose benefit was never measured. Revisit only with numbers.
      - name: Run PreReleasePlan
        run: |
          xcodebuild test \
            -project COIL.xcodeproj \
            -scheme COIL \
            -testPlan PreReleasePlan \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            clean test

      # Report-only. There is no historical coverage data for this repo yet, so any
      # threshold picked today would be a guess. Collect a baseline first, then decide
      # whether to ratchet.
      - name: Coverage summary (report only)
        if: always()
        run: xcrun xccov view --report --json TestResults.xcresult > coverage.json || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-coverage
          path: ios/PT-Helper/coverage.json

  beta:
    name: TestFlight Upload
    needs: [test, prerelease-tests]
    # Manual dispatch only. This job signs a real build and submits it to Apple,
    # and `changelog_from_git_commits` publishes the last 10 commit subjects
    # verbatim to testers — so it must never fire as a side effect of a merge or
    # a branch promotion. Run it deliberately from the Actions tab, after
    # checking what the changelog will say.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios/PT-Helper
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git against the remote, so don't leave the
          # credential in .git/config for later steps to find.
          persist-credentials: false
          fetch-depth: 0  # Full history for changelog generation

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/PT-Helper

      - name: Install signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Clean up
          rm certificate.p12

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Write API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p fastlane
          echo "$ASC_KEY_CONTENT" | base64 --decode > fastlane/AuthKey.p8

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane beta

      - name: Upload dSYMs to Crashlytics
        env:
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
        run: |
          # Find the Crashlytics upload-symbols script from SPM checkout
          UPLOAD_SCRIPT=$(find "${HOME}/Library/Developer/Xcode/DerivedData" \
            -name "upload-symbols" -path "*/FirebaseCrashlytics/*" 2>/dev/null | head -1)
          if [ -z "$UPLOAD_SCRIPT" ]; then
            echo "⚠️ upload-symbols not found in DerivedData, skipping dSYM upload"
            exit 0
          fi
          # Find dSYM files from the archive
          DSYM_DIR=$(find build -name "*.dSYM" -type d 2>/dev/null | head -1)
          if [ -z "$DSYM_DIR" ]; then
            echo "⚠️ No dSYM files found, skipping upload"
            exit 0
          fi
          echo "Uploading dSYMs from: $DSYM_DIR"
          "$UPLOAD_SCRIPT" -gsp COIL/GoogleService-Info.plist -p ios "$DSYM_DIR"

      # The signed IPA is deliberately NOT uploaded as a workflow artifact.
      # On a public repository, artifacts are downloadable by any authenticated
      # GitHub user for the retention window, and `if: always()` published the
      # distribution-signed build of an unreleased health app even on failed
      # runs. The build's destination is TestFlight, which the step above
      # already handled, so the artifact served no purpose.
